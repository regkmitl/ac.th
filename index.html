
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Picture</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        .background {
            position: fixed;
            inset: -20px;

            background-image: url("final%20ver.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(20px) brightness(0.6);
        }

        img {
            position: relative;
            display: block;

            width: 100%;
            height: 100%;
            height: 100dvh;

            object-fit: contain;
            object-position: center;
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <img src="final ver.png" alt="My Picture">

</body>
</html>
